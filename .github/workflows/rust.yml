name: RustDoc

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Rust
        run: |
          rustup install nightly
          rustup default nightly

      - name: Build Docs
        run: |
          RUSTFLAGS="-Awarnings" cargo build --quiet
          RUSTDOCFLAGS="-Zunstable-options --default-theme ayu --enable-index-page" cargo +nightly doc --lib --no-deps

      - name: Upload Docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

      - id: deployment
        name: Deploy Docs
        uses: actions/deploy-pages@v4
